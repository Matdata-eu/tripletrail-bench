name: Dashboard

# Publishes the benchmark dashboard (site/) with the results on main to GitHub Pages, plus one
# snapshot per earlier results commit for the page's version picker (site/build.py --history).
# Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths: ["bench/v2/results/**", "bench/v2/dashboard.py", "site/**", ".github/workflows/pages.yml"]
    # A results tag (results-2026-12, …) marks a snapshot in the picker. Path filters do not
    # apply to tag pushes.
    tags: ["results-*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0  # every results commit and tag, for the snapshots
      - name: Clone TripleTrail's history (commits only) to name the release each run measured
        run: git clone --quiet --bare --filter=blob:none https://github.com/Matdata-eu/tripletrail.git "$RUNNER_TEMP/core.git"
      - run: python3 site/build.py bench/v2/results _site --history --core "$RUNNER_TEMP/core.git"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
